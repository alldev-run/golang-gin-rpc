version: "2"

run:
  timeout: 5m

linters:
  default: standard
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
    paths:
      - examples/

formatters:
  enable:
    - gofmt
